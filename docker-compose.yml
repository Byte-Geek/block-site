name: blocare

services:
  platform-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${PLATFORM_DB_PASSWORD:?}
      POSTGRES_DB: platform
    volumes:
      - platform-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 10s
      retries: 5

  flowable-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: ${FLOWABLE_DB_PASSWORD:?}
      POSTGRES_DB: flowable
    volumes:
      - flowable-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowable"]
      interval: 10s
      retries: 5

  flowable-rest:
    image: flowable/flowable-rest:8.0.0
    restart: unless-stopped
    depends_on:
      flowable-db:
        condition: service_healthy
    environment:
      FLOWABLE_REST_APP_CREATE-DEMO-DEFINITIONS: "false"
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://flowable-db:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: ${FLOWABLE_DB_PASSWORD:?}
      FLOWABLE_REST_APP_ADMIN_USER-ID: ${FLOWABLE_USER:?}
      FLOWABLE_REST_APP_ADMIN_PASSWORD: ${FLOWABLE_PASSWORD:?}

  rustfs-perms:
    image: alpine:3.20
    user: root
    volumes:
      - rustfs-data:/data
    command: chown -R 10001:10001 /data

  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:?}
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_CORS_ALLOWED_ORIGINS: ${BETTER_AUTH_URL:?}
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - rustfs-data:/data

  migrate:
    build: .
    depends_on:
      platform-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://platform:${PLATFORM_DB_PASSWORD}@platform-db:5432/platform
    command: npx prisma migrate deploy

  app:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      flowable-rest:
        condition: service_started
      rustfs:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://platform:${PLATFORM_DB_PASSWORD}@platform-db:5432/platform
      FLOWABLE_URL: http://flowable-rest:8080/flowable-rest
      FLOWABLE_USER: ${FLOWABLE_USER}
      FLOWABLE_PASSWORD: ${FLOWABLE_PASSWORD}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?}
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  platform-data:
  flowable-data:
  rustfs-data: