name: blocare

services:
  platform-db:
    image: postgres:17
    container_name: blocare-platform-db
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports:
      - "5433:5432"
    volumes:
      - platform-data:/var/lib/postgresql/data

  flowable-db:
    image: postgres:17
    container_name: blocare-flowable-db
    environment:
      POSTGRES_USER: flowable
      POSTGRES_PASSWORD: flowable
      POSTGRES_DB: flowable
    volumes:
      - flowable-data:/var/lib/postgresql/data

  flowable-rest:
    image: flowable/flowable-rest:8.0.0
    container_name: blocare-flowable-rest
    depends_on:
      - flowable-db
    ports:
      - "8080:8080"
    environment:
      FLOWABLE_REST_APP_CREATE-DEMO-DEFINITIONS: "false"
      SPRING_DATASOURCE_DRIVER-CLASS-NAME: org.postgresql.Driver
      SPRING_DATASOURCE_URL: jdbc:postgresql://flowable-db:5432/flowable
      SPRING_DATASOURCE_USERNAME: flowable
      SPRING_DATASOURCE_PASSWORD: flowable
      FLOWABLE_REST_APP_ADMIN_USER-ID: rest-admin
      FLOWABLE_REST_APP_ADMIN_PASSWORD: test

  rustfs-perms:
    image: alpine
    user: root
    volumes:
      - rustfs-data:/data
    command: chown -R 10001:10001 /data

  rustfs:
    image: rustfs/rustfs:latest
    container_name: blocare-rustfs
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    environment:
      RUSTFS_ACCESS_KEY: blocare-admin
      RUSTFS_SECRET_KEY: blocare-secret-2026
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

volumes:
  platform-data:
  flowable-data:
  rustfs-data: